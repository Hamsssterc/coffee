<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fff; }
        .btn { padding: 12px 24px; font-size: 16px; background: #3390ec; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <h2>Тест виджета ☕️</h2>
        <button class="btn" onclick="sendOrder()">Заказать кофе</button>
    </div>
    <script>
        function sendOrder() {
            document.querySelector('.btn').innerText = "Отправка...";
            TelegramWidget.request("test_order_123");
        }

        TelegramWidget.onEvent = function(eventType, eventData) {
            if (eventType === 'widget_data_updated') {
                let data = JSON.parse(eventData);
                if (data.status === "success") {
                    document.getElementById('app').innerHTML = "<h2>" + data.text + " ✅</h2><p>Спасибо!</p>";
                }
            }
        };
    </script>
</body>
</html>
